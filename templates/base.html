{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Choice Select{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {% block announcement %}{% endblock %}
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="{% url 'home' %}">Choice Select</a>
      <nav class="site-nav">
        <a href="{% url 'tryouts:signup' %}">Try-Outs</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message message--{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; {% now "Y" %} Choice Select</p>
    </div>
  </footer>
</body>
</html>
